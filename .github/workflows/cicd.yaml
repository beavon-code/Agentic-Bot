name: CI/CD - Docker Hub and AWS ECS Fargate (Self-hosted Runner)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: agentic-chatbot-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: REPLACE_WITH_YOUR_AWS_REGION
  DOCKERHUB_IMAGE: REPLACE_WITH_DOCKERHUB_USERNAME/agentic-chatbot
  ECS_CLUSTER: REPLACE_WITH_EXISTING_ECS_CLUSTER_NAME
  ECS_SERVICE: REPLACE_WITH_EXISTING_ECS_SERVICE_NAME
  ECS_TASK_DEFINITION: .aws/task-definition.json
  CONTAINER_NAME: agentic-chatbot

jobs:
  build-push-deploy:
    name: Build, push, and deploy
    # Assumes the self-hosted runner has Linux and x64 labels.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Verify runner tools
        shell: bash
        run: |
          python3 --version
          docker --version
          aws --version
          docker info

      - name: Install dependencies and check Python syntax
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          test -f requirements.txt
          python3 -m pip install -r requirements.txt
          python3 -m compileall -q .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsAgenticChatbot

      - name: Update application environment secret in AWS Secrets Manager
        env:
          AWS_APP_ENV_SECRET_ARN: ${{ secrets.AWS_APP_ENV_SECRET_ARN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_APP_ENV_SECRET_ARN"

          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT
          chmod 600 "$SECRET_FILE"
          export SECRET_FILE

          python3 - <<'PY'
          import json
          import os

          keys = [
              "DEEPSEEK_API_KEY",
              "GROQ_API_KEY",
              "TAVILY_API_KEY",
              "LANGSMITH_TRACING",
              "LANGSMITH_ENDPOINT",
              "LANGSMITH_API_KEY",
              "LANGSMITH_PROJECT",
          ]
          missing = [key for key in keys if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))

          with open(os.environ["SECRET_FILE"], "w", encoding="utf-8") as f:
              json.dump({key: os.environ[key] for key in keys}, f)
          PY

          aws secretsmanager put-secret-value \
            --secret-id "$AWS_APP_ENV_SECRET_ARN" \
            --secret-string "file://$SECRET_FILE" \
            --region "$AWS_REGION" \
            --query ARN \
            --output text

      - name: Prepare task definition without modifying repository file
        env:
          AWS_APP_ENV_SECRET_ARN: ${{ secrets.AWS_APP_ENV_SECRET_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_TASK_DEFINITION="$ECS_TASK_DEFINITION"
          export RENDER_TASK_DEFINITION="$RUNNER_TEMP/task-definition.json"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["SOURCE_TASK_DEFINITION"])
          target = Path(os.environ["RENDER_TASK_DEFINITION"])
          arn = os.environ.get("AWS_APP_ENV_SECRET_ARN", "")

          if not arn.startswith("arn:"):
              raise SystemExit("AWS_APP_ENV_SECRET_ARN must be a full Secrets Manager ARN.")

          task = json.loads(source.read_text(encoding="utf-8"))
          for container in task.get("containerDefinitions", []):
              for secret in container.get("secrets", []):
                  value = secret.get("valueFrom", "")
                  placeholder = "REPLACE_WITH_APP_ENV_SECRET_ARN"
                  if placeholder in value:
                      secret["valueFrom"] = value.replace(placeholder, arn)

          target.write_text(json.dumps(task, indent=2), encoding="utf-8")
          print(f"Prepared task definition at {target}")
          PY

      - name: Render task definition with the new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ runner.temp }}/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Deploy to existing ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
