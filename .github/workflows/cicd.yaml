name: CI/CD - Streamlit on EC2 (self-hosted runner)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: agentic-bot
  CONTAINER_NAME: agentic-bot

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Runs inside a Python container so the runner needs no Python install
      - name: Lint and test
        run: |
          docker run --rm -v "$PWD":/app -w /app python:3.11-slim bash -c '
            pip install -q -r requirements.txt pytest flake8 &&
            flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv &&
            (pytest || [ $? -eq 5 ])   # exit code 5 = no tests collected
          '

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:latest \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Secrets come from GitHub Secrets; non-secret settings come from GitHub Variables
      # (with defaults). They go through env: so secrets stay masked in logs.
      - name: Create env file
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: ${{ vars.LANGSMITH_TRACING || 'true' }}
          LANGSMITH_ENDPOINT: ${{ vars.LANGSMITH_ENDPOINT || 'https://api.smith.langchain.com' }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
        run: |
          umask 077
          {
            printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY"
            printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY"
            printf 'TAVILY_API_KEY=%s\n' "$TAVILY_API_KEY"
            printf 'LANGSMITH_API_KEY=%s\n' "$LANGSMITH_API_KEY"
            printf 'LANGSMITH_TRACING=%s\n' "$LANGSMITH_TRACING"
            printf 'LANGSMITH_ENDPOINT=%s\n' "$LANGSMITH_ENDPOINT"
            printf 'LANGSMITH_PROJECT=%s\n' "$LANGSMITH_PROJECT"
          } > "$RUNNER_TEMP/app.env"

      - name: agentic-bot
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p 80:8501 \
            --env-file "$RUNNER_TEMP/app.env" \
            ${{ env.IMAGE_NAME }}:latest

      - name: Remove env file
        if: always()
        run: rm -f "$RUNNER_TEMP/app.env"

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fs http://localhost:80/_stcore/health; then
              echo "App is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs ${{ env.CONTAINER_NAME }}
          exit 1

      - name: Clean up old images
        run: docker image prune -f